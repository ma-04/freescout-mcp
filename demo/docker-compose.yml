services:
  freescout:
    image: nfrastack/freescout:latest
    container_name: freescout-demo
    restart: always
    depends_on:
      - freescout-db
    environment:
      - CONTAINER_NAME=freescout-demo
      - DB_HOST=freescout-db
      - DB_NAME=freescout
      - DB_USER=freescout
      - DB_PASS=${DB_PASS}
      - APP_URL=https://${DEMO_HOST}
      - SETUP_TYPE=AUTO
      - ADMIN_FIRST_NAME=Demo
      - ADMIN_LAST_NAME=Admin
      - FREESCOUT_APP_TRUSTED_PROXIES=*
      - ADMIN_EMAIL=${ADMIN_EMAIL}
      - ADMIN_PASS=${ADMIN_PASS}
      - FREESCOUT_APP_DEBUG=false
      - TIMEZONE=UTC
      - VIRTUAL_HOST=${DEMO_HOST}
      - VIRTUAL_PORT=80
      - LETSENCRYPT_HOST=${DEMO_HOST}
      - LETSENCRYPT_EMAIL=${LETSENCRYPT_EMAIL}
      - HTTPS_METHOD=redirect
    volumes:
      - ./data/freescout:/data
      - ./logs/freescout:/logs
    networks:
      - freescout-internal
      - wordpress-sites
  freescout-db:
    image: mariadb:10.11
    container_name: freescout-demo-db
    restart: always
    environment:
      - MARIADB_ROOT_PASSWORD=${DB_ROOT_PASS}
      - MARIADB_DATABASE=freescout
      - MARIADB_USER=freescout
      - MARIADB_PASSWORD=${DB_PASS}
    volumes:
      - ./data/db:/var/lib/mysql
    networks:
      - freescout-internal
networks:
  freescout-internal:
    name: ${DEMO_HOST}
  wordpress-sites:
    name: wordpress-sites
    external: true
